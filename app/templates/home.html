<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6fa;
        }
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 220px;
            background: #232d3b;
            color: #fff;
            padding-top: 32px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.04);
        }
        .sidebar h2 {
            text-align: center;
            font-size: 22px;
            margin-bottom: 32px;
            letter-spacing: 2px;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li {
            margin: 18px 0;
        }
        .sidebar ul li a {
            color: #bfc9da;
            text-decoration: none;
            font-size: 16px;
            padding: 10px 32px;
            display: flex;
            align-items: center;
            transition: background 0.2s, color 0.2s;
        }
        .sidebar ul li a:hover, .sidebar ul li.active a {
            background: #2e3b4e;
            color: #fff;
            border-left: 4px solid #55acee;
        }
        .sidebar ul li a i {
            margin-right: 14px;
            font-size: 18px;
        }
        .main-content {
            margin-left: 220px;
            padding: 60px 40px;
        }
        .welcome-box {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
            padding: 48px 32px;
            text-align: center;
            max-width: 500px;
            margin: 60px auto;
        }
        .welcome-box h1 {
            color: #232d3b;
            font-size: 32px;
            margin-bottom: 18px;
        }
        .welcome-box p {
            color: #555;
            font-size: 18px;
            margin-bottom: 32px;
        }
        .welcome-box a {
            display: inline-block;
            background: #55acee;
            color: #fff;
            padding: 14px 36px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .welcome-box a:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2><i class="fa fa-lock"></i> DES App</h2>
        <ul>
            <li class="active"><a href="{{ url_for('routes.home') }}"><i class="fa fa-home"></i>Home</a></li>
            <li><a href="{{ url_for('routes.login') }}"><i class="fa fa-sign-in-alt"></i>Login</a></li>
            <li><a href="{{ url_for('routes.register') }}"><i class="fa fa-user-plus"></i>Register</a></li>
            <li><a href="{{ url_for('routes.encrypt') }}"><i class="fa fa-lock"></i>Encrypt</a></li>
            <li><a href="{{ url_for('routes.decrypt') }}"><i class="fa fa-lock"></i>Decrypt</a></li>
            <li><a href="{{ url_for('routes.file_encrypt') }}"><i class="fa fa-file-contract"></i>File Encrypt</a></li>
            <li><a href="{{ url_for('routes.file_decrypt') }}"><i class="fa fa-file-export"></i>File Decrypt</a></li>
            <li><a href="{{ url_for('routes.index') }}"><i class="fa fa-comments"></i>Chat Room</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="welcome-box">
            <h1>Welcome to MyApp!</h1>
            <a href="{{ url_for('routes.login') }}">Get Started</a>
        </div>
    </div>
</body>
</html>
