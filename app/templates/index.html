<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Chat Room - DES App</title>
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
		<style>
			body {
				margin: 0;
				font-family: 'Segoe UI', Arial, sans-serif;
				background: #f4f6fa;
				color: #232d3b;
			}
			.sidebar {
				position: fixed;
				left: 0; top: 0; bottom: 0;
				width: 220px;
				background: #232d3b;
				color: #fff;
				padding-top: 32px;
				box-shadow: 2px 0 12px rgba(0,0,0,0.04);
				z-index: 10;
			}
			.sidebar h2 {
				text-align: center;
				font-size: 22px;
				margin-bottom: 32px;
				letter-spacing: 2px;
			}
			.sidebar ul {
				list-style: none;
				padding: 0;
			}
			.sidebar ul li {
				margin: 18px 0;
			}
			.sidebar ul li a {
				color: #bfc9da;
				text-decoration: none;
				font-size: 16px;
				padding: 10px 32px;
				display: flex;
				align-items: center;
				transition: background 0.2s, color 0.2s;
			}
			.sidebar ul li a:hover, .sidebar ul li.active a {
				background: #2e3b4e;
				color: #fff;
				border-left: 4px solid #55acee;
			}
			.sidebar ul li a i {
				margin-right: 14px;
				font-size: 18px;
			}
			.main-content {
				margin-left: 220px;
				padding: 40px 0 0 0;
				min-height: 100vh;
			}
			.chat-container {
				display: flex;
				gap: 32px;
				max-width: 1100px;
				margin: 0 auto;
			}
			.chat-sidebar {
				width: 260px;
				background: #fff;
				border-radius: 12px;
				box-shadow: 0 4px 24px rgba(0,0,0,0.07);
				padding: 28px 18px 18px 18px;
				margin-top: 32px;
				flex-shrink: 0;
			}
			.chat-sidebar h3 {
				color: #232d3b;
				font-size: 18px;
				margin-bottom: 12px;
			}
			.room-item {
				padding: 10px 16px;
				border-radius: 6px;
				margin-bottom: 8px;
				background: #f4f7fa;
				color: #232d3b;
				cursor: pointer;
				transition: background 0.2s, color 0.2s;
			}
			.room-item.active, .room-item:hover {
				background: #55acee;
				color: #fff;
			}
			.user-list {
				margin-top: 32px;
			}
			.user-list h3 {
				margin-bottom: 10px;
			}
			.user-item {
				padding: 8px 14px;
				border-radius: 6px;
				margin-bottom: 6px;
				background: #f4f7fa;
				color: #232d3b;
			}
			.main-chat {
				flex: 1;
				background: #fff;
				border-radius: 12px;
				box-shadow: 0 4px 24px rgba(0,0,0,0.07);
				display: flex;
				flex-direction: column;
				margin-top: 32px;
				min-width: 0;
			}
			.main-chat-header {
				padding: 24px 32px 0 32px;
				font-size: 22px;
				font-weight: 600;
				color: #232d3b;
			}
			#chat {
				flex: 1;
				padding: 24px 32px;
				overflow-y: auto;
				background: #f4f6fa;
				max-height: 400px;
				min-height: 200px;
			}
			.input-area {
				display: flex;
				gap: 10px;
				padding: 24px 32px;
				background: #fff;
				border-bottom-left-radius: 12px;
				border-bottom-right-radius: 12px;
			}
			#message {
				flex: 1;
				padding: 12px 15px;
				border: 1px solid #d1d5db;
				border-radius: 25px;
				outline: none;
				font-size: 1em;
				background: #f9fafb;
				color: #232d3b;
			}
			#message:focus {
				border-color: #55acee;
				box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
			}
			button {
				padding: 12px 25px;
				border: none;
				border-radius: 25px;
				background: #55acee;
				color: white;
				cursor: pointer;
				font-weight: 500;
				font-size: 1rem;
				transition: background 0.2s;
			}
			button:hover {
				background: #2980b9;
			}
			@media (max-width: 900px) {
				.chat-container { flex-direction: column; gap: 0; }
				.main-content { padding: 0; }
				.chat-sidebar, .main-chat { margin-top: 18px; }
			}
			@media (max-width: 700px) {
				.sidebar { position: static; width: 100%; }
				.main-content { margin-left: 0; padding: 0; }
				.chat-container { max-width: 100vw; }
			}
			/* Bubble chat style */
			.message {
				max-width: 70%;
				margin-bottom: 4px;
				padding: 10px 16px;
				border-radius: 18px;
				word-break: break-word;
				display: block;
				font-size: 1em;
				position: relative;
				box-shadow: 0 2px 8px rgba(0,0,0,0.08);
				clear: both;
			}
			.message.own {
				background: #55acee;
				color: #fff;
				margin-left: auto;
				margin-right: 8px;
				text-align: left;
				border-bottom-right-radius: 4px;
				font-weight: 500;
			}
			.message.other {
				background: #f1f0f0;
				color: #232d3b;
				margin-right: auto;
				margin-left: 8px;
				text-align: left;
				border-bottom-left-radius: 4px;
				font-weight: 500;
			}
			.message.private {
				background: #ffe082;
				color: #232d3b;
				margin-left: auto;
				margin-right: 8px;
				text-align: left;
				border-bottom-right-radius: 4px;
				border: 1px solid #ffd54f;
				font-weight: 500;
			}
			.message.system {
				background: transparent;
				color: #888;
				text-align: center;
				margin: 10px auto;
				display: block;
				font-style: italic;
				box-shadow: none;
				padding: 0;
			}
			.toast-notify {
				position: fixed;
				bottom: 30px;
				right: 30px;
				background: #55acee;
				color: #fff;
				padding: 16px 28px;
				border-radius: 8px;
				font-size: 1.1em;
				box-shadow: 0 2px 12px rgba(0,0,0,0.15);
				z-index: 9999;
				animation: fadein 0.5s, fadeout 0.5s 3.5s;
			}
			@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
			@keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }
		</style>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
	</head>
	<body>
		<div class="sidebar">
			<h2><i class="fa fa-lock"></i> DES App</h2>
			<ul>
				<li><a href="{{ url_for('routes.home') }}"><i class="fa fa-home"></i>Home</a></li>
				<li><a href="{{ url_for('routes.login') }}"><i class="fa fa-sign-in-alt"></i>Login</a></li>
				<li><a href="{{ url_for('routes.register') }}"><i class="fa fa-user-plus"></i>Register</a></li>
				<li><a href="{{ url_for('routes.encrypt') }}"><i class="fa fa-lock"></i>Encrypt</a></li>
				<li><a href="{{ url_for('routes.decrypt') }}"><i class="fa fa-lock"></i>Decrypt</a></li>
				<li><a href="{{ url_for('routes.file_encrypt') }}"><i class="fa fa-file-contract"></i>File Encrypt</a></li>
           	 	<li><a href="{{ url_for('routes.file_decrypt') }}"><i class="fa fa-file-export"></i>File Decrypt</a></li>
				<li class="active"><a href="{{ url_for('routes.index') }}"><i class="fa fa-comments"></i>Chat Room</a></li>
				<li><a href="{{ url_for('routes.logout') }}"><i class="fa fa-sign-out-alt"></i>Logout</a></li>
			</ul>
		</div>
		<div class="main-content">
			<div class="chat-container">
				<div class="chat-sidebar">
					<h3>Rooms</h3>
					<div id="room-list">
						{% for room in rooms %}
						<div class="room-item" onclick="joinRoom('{{ room }}')" id="room-{{ room }}">{{ room }}</div>
						{% endfor %}
					</div>
					<div class="user-list">
						<h3>Online Users</h3>
						<div id="active-users"></div>
					</div>
				</div>
				<div class="main-chat">
					<div class="main-chat-header">Welcome, <span id="username">{{ username }}</span>!</div>
					<div id="chat"></div>
					<div class="input-area">
						<input id="message" type="text" placeholder="Type a message..." onkeypress="handleKeyPress(event)" />
						<button onclick="sendMessage()">Send</button>
					</div>
				</div>
			</div>
		</div>
		<script src="{{ url_for('static', filename='js/chat.js') }}"></script>
	</body>
</html>
